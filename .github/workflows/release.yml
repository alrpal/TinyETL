name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS build (Apple Silicon only; Homebrew no longer supports Intel Macs, so there
          # is no way to get an x86_64 libltdl.a on the runner)
          - target: aarch64-apple-darwin
            os: macos-latest
            name: tinyetl-macos-apple-silicon-aarch64
          # Linux build
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: tinyetl-linux-x86_64
          # Windows builds
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: tinyetl-windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: tinyetl-windows-aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.target }}-
          ${{ runner.os }}-cargo-

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # libltdl-dev provides the static libltdl.a linked into the binary with the bundled unixODBC.
        # unixodbc-dev must NOT be installed: its libodbc would be linked instead of the bundled copy.
        sudo apt-get install -y pkg-config libssl-dev libltdl-dev
        # rustc only finds static libraries on explicit search paths; point odbc-sys at libltdl.a
        echo "ODBC_SYS_STATIC_PATH=/usr/lib/$(gcc -print-multiarch)" >> $GITHUB_ENV

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # libtool provides the static libltdl.a linked into the binary with the bundled unixODBC.
        # The -L flag puts libtool's own lib directory first on the linker search path.
        brew list libtool >/dev/null 2>&1 || brew install libtool
        echo "RUSTFLAGS=-L /opt/homebrew/opt/libtool/lib" >> $GITHUB_ENV

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Windows has native ODBC support, no additional installation needed
        echo "Using Windows native ODBC driver manager"

    - name: Build release binary
      id: build
      run: cargo build --release --target ${{ matrix.target }}


    - name: Check build success
      if: failure() && steps.build.outcome == 'failure'
      run: |
        echo "::error::Build failed for ${{ matrix.target }}"
        echo "::notice::This platform will be skipped in the release"
        exit 1

    # The binary must run on a machine with nothing installed (no libodbc, libltdl, etc.)
    - name: Verify no third-party shared libraries (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        BIN=target/${{ matrix.target }}/release/tinyetl
        ldd "$BIN"
        if ldd "$BIN" | grep -E "libodbc|libltdl|not found"; then
          echo "::error::Binary links a library that is not available on a clean system"
          exit 1
        fi
        # Run it in a bare container, as a user downloading the release would
        docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/dist:ro" ubuntu:24.04 /dist/tinyetl --version
        docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/dist:ro" debian:12-slim /dist/tinyetl --version

    - name: Verify no third-party shared libraries (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        BIN=target/${{ matrix.target }}/release/tinyetl
        otool -L "$BIN"
        if otool -L "$BIN" | tail -n +2 | grep -v -E "^\s+(/usr/lib/|/System/Library/)"; then
          echo "::error::Binary links a library outside /usr/lib and /System/Library"
          exit 1
        fi

    - name: Prepare binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/tinyetl dist/
        chmod +x dist/tinyetl
        # The binary bundles unixODBC (LGPL-2.1-or-later); ship the license texts with it
        cp LICENSE THIRD_PARTY_LICENSES.md dist/
        cp -r licenses dist/
        # Record the exact versions of the statically linked LGPL libraries
        if [ "$RUNNER_OS" = "Linux" ]; then
          LTDL="libltdl-dev $(dpkg-query -W -f='${Version}' libltdl-dev) (Ubuntu package)"
        else
          LTDL="Homebrew $(brew list --versions libtool)"
        fi
        UNIX_ODBC=$(grep -A1 '^name = "unix-odbc"' Cargo.lock | grep version | cut -d'"' -f2)
        {
          echo "TinyETL ${{ github.ref_name }} (${{ matrix.target }}), commit ${{ github.sha }}"
          echo "unixODBC: 2.3.14 via the unix-odbc crate ${UNIX_ODBC} (https://crates.io/crates/unix-odbc/${UNIX_ODBC})"
          echo "GNU libltdl: ${LTDL}"
        } > dist/licenses/BUILD-INFO.txt
        cat dist/licenses/BUILD-INFO.txt

    - name: Prepare binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir dist
        cp target/${{ matrix.target }}/release/tinyetl.exe dist/
        cp LICENSE dist/
        cp THIRD_PARTY_LICENSES.md dist/

    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        tar -czf ${{ matrix.name }}.tar.gz -C dist .

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path dist/* -DestinationPath ${{ matrix.name }}.zip

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: |
          ${{ matrix.name }}.tar.gz
          ${{ matrix.name }}.zip
        if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check build results
      id: check-builds
      run: |
        echo "Checking which builds succeeded..."
        # The workflow will continue even if some builds failed
        # We'll upload whatever artifacts are available

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
      continue-on-error: true

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        if [ -d "artifacts" ]; then
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          echo "Available release assets:"
          ls -la release-assets/ || echo "No artifacts found"
          
          # Count successful builds
          ASSET_COUNT=$(find release-assets -type f | wc -l)
          echo "::notice::Found $ASSET_COUNT platform builds for release"
          
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::No build artifacts found - all builds may have failed"
            exit 1
          fi
        else
          echo "::error::No artifacts directory found"
          exit 1
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
        body: |
          ### License notice

          The Linux and macOS binaries include the [unixODBC](https://www.unixodbc.org/) driver manager (version 2.3.14) and GNU libltdl, statically linked and licensed under the **GNU LGPL v2.1 or later**. TinyETL itself is licensed under Apache 2.0; the LGPL applies only to those bundled libraries, and the additional commercial terms in `LICENSE` do not apply to them. License texts are included in each download (`THIRD_PARTY_LICENSES.md` and `licenses/`). See [THIRD_PARTY_LICENSES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/THIRD_PARTY_LICENSES.md) for source and relinking information.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
