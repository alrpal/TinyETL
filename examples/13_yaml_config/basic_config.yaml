# TinyETL job file: CSV to JSON with a Lua transform
# Run it with: tinyetl run basic_config.yaml

source: employees.csv
target: employees_output.json
batch_size: 1000

# One assignment per line; every input column is kept, and each line can use
# the ones before it
transform: |
  id = 55555
  full_name = row.first_name .. " " .. row.last_name
  annual_salary = row.monthly_salary * 12
  hire_year = tonumber(string.sub(row.hire_date, 1, 4))
  current_year = 2024
  years_service = current_year - hire_year
