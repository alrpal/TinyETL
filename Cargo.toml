[package]
name = "tinyetl"
version = "0.11.1"
edition = "2021"
rust-version = "1.94"
resolver = "2"

# Add these required fields:
authors = ["Alex Nemeth <alex@alexnemethdata.com>"]
description = "Fast, zero-config ETL in a single binary for transforming data between formats and databases"
license = "Apache-2.0"  # You have an Apache 2.0 LICENSE file
repository = "https://github.com/alrpal/TinyETL"
homepage = "https://tinyetl.com"
documentation = "https://tinyetl.com/docs"
readme = "README.md"
keywords = ["etl", "data", "database", "csv", "parquet"]  # Max 5 keywords
categories = ["database", "command-line-utilities"]  # See crates.io categories

[dependencies]
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
# No default features: TinyETL builds queries at runtime, so it needs neither the query macros (whose
# proc-macro would need a system OpenSSL to build) nor `any`/`migrate`. `json` decodes MySQL JSON columns.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-native-tls", "sqlite", "postgres", "mysql", "chrono", "json", "rust_decimal"] }
csv = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1.10"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
arrow = { version = "58", features = ["csv", "json"] }
parquet = { version = "58", features = ["arrow", "async"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
url = "2.4"
reqwest = { version = "0.11", features = ["json", "native-tls"] }
tempfile = "3.8"
apache-avro = "0.16"
rust_decimal = { version = "1.35", features = ["serde", "db-postgres", "db-tokio-postgres"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "winauth", "rustls", "sql-browser-async-std", "chrono", "rust_decimal"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"
duckdb = { version = "~1.4.5", features = ["bundled"] }
odbc-api = { version = "30.1.0", default-features = false, features = ["narrow", "odbc_version_3_80"] }
hex = "0.4"
memchr = "2"
calamine = { version = "0.38", features = ["chrono"] }
rust_xlsxwriter = { version = "0.103", features = ["chrono", "constant_memory"] }
object_store = { version = "0.13", features = ["aws"] }
firn = "0.17"
zstd = "0.13"
flate2 = "1"
percent-encoding = "2"

# On Linux and macOS, compile the unixODBC driver manager into the binary so it has no runtime
# dependency on libodbc. Windows uses its built-in ODBC driver manager instead.
# The bundled unixODBC is licensed LGPL-2.1-or-later; see THIRD_PARTY_LICENSES.md.
# (The unix-odbc crate loads drivers with plain dlopen(), so GNU libltdl is not needed.)
[target.'cfg(not(windows))'.dependencies]
odbc-api = { version = "30.1.0", default-features = false, features = ["vendored-unix-odbc"] }
# setlocale(), so ODBC drivers can convert Unicode text (see connectors::odbc)
libc = "0.2"

# On Linux, compile OpenSSL into the binary (used for TLS by the Postgres, MySQL, MSSQL and HTTP
# connectors through native-tls), so it doesn't need the distribution's libssl at runtime.
# macOS and Windows use the system TLS libraries, which are always present.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true  # Remove debug symbols for smaller binaries
